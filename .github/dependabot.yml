version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: monthly
    commit-message:
      prefix: github-actions

  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: monthly
    commit-message:
      prefix: npm
    groups:
      # react and react-dom must resolve to the exact same version — a
      # partial bump ships a runtime crash (React error #527) that
      # build-time CI cannot catch, so the ecosystem updates as one PR.
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'

  - package-ecosystem: pip
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: monthly
    commit-message:
      prefix: pip

  - package-ecosystem: uv
    directory: /
    open-pull-requests-limit: 1
    schedule:
      interval: monthly
    commit-message:
      prefix: uv
